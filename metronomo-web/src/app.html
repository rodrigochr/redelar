<title>BluesTempo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Metrônomo com levadas reais de blues, rock e jazz: shuffle, boogie, slow blues, walking bass.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">

<div id="app">
  <header class="transport" id="transport">
    <div class="status-row">
      <span class="mode-tag" id="mode-tag">Metrônomo · 4/4</span>
      <span class="status" id="status"></span>
      <span class="clock" id="clock">0:00</span>
    </div>
    <div class="beats" id="beats" aria-hidden="true"></div>
    <div class="tempo-row">
      <button type="button" class="round" data-repeat="bpm" data-delta="-1" aria-label="Diminuir andamento">−</button>
      <div class="tempo">
        <output class="bpm" id="bpm" aria-live="off">100</output>
        <span class="bpm-label" id="bpm-label">BPM (♩) · Moderato</span>
      </div>
      <button type="button" class="round" data-repeat="bpm" data-delta="1" aria-label="Aumentar andamento">+</button>
    </div>
    <label class="visually-hidden" for="bpm-slider">Andamento</label>
    <input id="bpm-slider" class="bpm-slider" type="range" min="20" max="300" step="1" value="100">
    <div class="controls">
      <button type="button" class="tap" data-action="tap">TAP</button>
      <button type="button" class="play" id="play" data-action="play" aria-label="Tocar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="chord-box" id="chord-box" hidden>
        <strong id="chord">A7</strong>
        <small id="chord-next">depois: A7</small>
      </div>
    </div>
    <p class="loading" id="loading" hidden>Carregando instrumentos reais…</p>
  </header>

  <main class="tab" id="tab"></main>

  <nav class="tabs" aria-label="Seções">
    <button type="button" data-action="tab" data-tab="metronome">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5l4 17h-13z M12 16 17 6.5"/></svg>Metrônomo</button>
    <button type="button" data-action="tab" data-tab="grooves">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 3 0 1 0 16 0a8 3 0 1 0-16 0 M4 10v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7 M6 2.5l5.5 6.5 M18 2.5 12.5 9"/></svg>Levadas</button>
    <button type="button" data-action="tab" data-tab="practice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0 M12 14V10 M10 2.5h4 M12 2.5V7"/></svg>Treino</button>
    <button type="button" data-action="tab" data-tab="presets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg>Presets</button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="app.js"></script>
