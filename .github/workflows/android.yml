name: Android (BluesTempo)

on:
  push:
    paths:
      - "metronomo-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "metronomo-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metronomo-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: APK de debug
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BluesTempo-debug-apk
          path: metronomo-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: metronomo-android/app/build/reports/tests/
