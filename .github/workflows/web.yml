name: Web (BluesTempo)

on:
  push:
    paths:
      - "metronomo-web/**"
      - "metronomo-android/app/src/main/assets/samples/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "metronomo-web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metronomo-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: metronomo-web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Paridade com o app Android
        run: node test/parity.mjs

      - name: Teste no navegador
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node test/smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: metronomo-web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
